name: Xbox UWP shell

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake --preset windows-msvc

      - name: Build
        run: cmake --build --preset windows-msvc-debug

      - name: Run probes
        run: ctest --preset windows-msvc-debug

  build-uwp-package:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build signed UWP sideload package
        shell: powershell
        run: .\scripts\windows\Build-UwpPackage.ps1

      - name: Upload Xbox Dev Mode package
        uses: actions/upload-artifact@v4
        with:
          name: xbox-shell-uwp-sideload
          path: out/package/xbox-uwp/
          if-no-files-found: error
          retention-days: 14
